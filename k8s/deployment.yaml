apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen14b-serving
  namespace: project
  labels:
    app: qwen14b-serving
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qwen14b-serving
  template:
    metadata:
      labels:
        app: qwen14b-serving
    spec:
      containers:
        - name: vllm-serving
          image: ranaalshaikh/qwen2.5-14b-vllm:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: VLLM_API_KEY
              valueFrom:
                secretKeyRef: {name: serving-keys, key: api-key}
          resources:
            requests:
              cpu: "4"
              memory: 24Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "8"
              memory: 36Gi
              nvidia.com/gpu: "1"
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 15
            failureThreshold: 3
          volumeMounts:
            - name: hf-cache
              mountPath: /root/.cache/huggingface
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: hf-cache
          hostPath:
            path: /root/.cache/huggingface
            type: DirectoryOrCreate
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi